name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  catalogue:
    name: The catalogue matches the skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # The catalogue is generated from skills/ and the README table, and the build refuses a
      # skill with no row or a row with no skill. Checking the committed copy is current is
      # what stops the page describing a set nobody has.
      - name: site/catalogue.json is current
        run: |
          node scripts/build-catalogue.mjs
          git diff --exit-code site/catalogue.json \
            || { echo "site/catalogue.json is stale. Run: node scripts/build-catalogue.mjs"; exit 1; }

  site:
    name: The catalogue works in a browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  # yasbd head: 30af305f44a857a8f0c71d59e48b5383f72b1de1
  verify-yasbd-349:
    name: Verify yasbd #349 (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: rlawoals0529/yasbd-lib
          ref: bugfix/349-reference-abbreviations
          path: yasbd-lib
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          activate-environment: true
      - run: uv pip install -e ".[dev]" spacy langcodes py3langid
        working-directory: yasbd-lib
      - run: uv run pytest -v --tb=short
        working-directory: yasbd-lib
      - if: matrix.python == '3.12'
        run: |
          uv run ruff format src/ --check
          uv run ruff check src/
        working-directory: yasbd-lib
      - if: matrix.python == '3.12'
        run: |
          python3 scripts/reformat_sets.py
          git diff --exit-code -- \
            src/yasbd/rules/base.py \
            src/yasbd/rules/es.py \
            src/yasbd/rules/pt.py \
            src/yasbd/rules/fr.py
        working-directory: yasbd-lib
