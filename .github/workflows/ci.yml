name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  catalogue:
    name: The catalogue matches the skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # The catalogue is generated from skills/ and the README table, and the build refuses a
      # skill with no row or a row with no skill. Checking the committed copy is current is
      # what stops the page describing a set nobody has.
      - name: site/catalogue.json is current
        run: |
          node scripts/build-catalogue.mjs
          git diff --exit-code site/catalogue.json \
            || { echo "site/catalogue.json is stale. Run: node scripts/build-catalogue.mjs"; exit 1; }

  site:
    name: The catalogue works in a browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  verify-ecsodus:
    name: Verify Ecsodus HTML report (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: rlawoals0529/ecsodus
          ref: feat/html-report
          path: ecsodus
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.10"
          terraform_wrapper: false
      - run: uv sync
        working-directory: ecsodus
      - run: uv run ruff check .
        working-directory: ecsodus
      - run: uv run ruff format --check .
        working-directory: ecsodus
      - run: uv run mypy src
        working-directory: ecsodus
      - run: uv run pytest -q
        working-directory: ecsodus
