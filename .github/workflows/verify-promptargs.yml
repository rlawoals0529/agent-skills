name: Verify promptargs shell quoting

on:
  push:
    branches:
      - ci/verify-promptargs-fd9e286

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: rlawoals0529/promptargs
          ref: ac8e0b916df6fa19a9fb3c8c24bee6b15fcece5d
          path: promptargs
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: promptargs/package-lock.json
      - name: Install
        working-directory: promptargs
        run: npm ci --ignore-scripts
      - name: Lint
        working-directory: promptargs
        run: npm run lint
      - name: Build
        working-directory: promptargs
        run: npm run build
      - name: Check committed dist
        working-directory: promptargs
        run: |
          test -z "$(git status --porcelain -- dist/)" || {
            git diff -- dist/
            git status --short -- dist/
            exit 1
          }
      - name: Test
        working-directory: promptargs
        run: npm test
      - name: CLI smoke
        working-directory: promptargs
        run: |
          node dist/cli.js help
          node dist/cli.js env
          node dist/cli.js "Hello {{name}}" --name=World --no-interactive
          node dist/cli.js "Review {{file}} for {{focus}}" --file=a.go,b.go --focus=x,y --cross --no-interactive
