name: Reusable repository security baseline

on:
  workflow_call:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pin third-party actions to immutable commits. v4 currently resolves to this SHA.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Reject tracked secret files
        shell: bash
        run: |
          set -euo pipefail
          tracked="$(git ls-files)"
          bad="$(printf '%s\n' "$tracked" | grep -E '(^|/)(\.env($|\.)|\.dev\.vars$|id_rsa$|id_ed25519$|[^/]+\.(pem|p12|pfx|key)$)' | grep -Ev '(^|/)(\.env\.example|\.env\.sample|\.env\.template)$' || true)"
          if [ -n "$bad" ]; then
            echo 'Sensitive-looking files are tracked:'
            printf '%s\n' "$bad"
            exit 1
          fi

      - name: Require environment files to be ignored
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .gitignore ]; then
            echo 'No .gitignore exists. Add one before introducing local secrets or build artifacts.'
            exit 1
          fi
          if ! grep -Eq '(^|/)\.env(\*|$|\.)|\.env\*' .gitignore; then
            echo '.gitignore must ignore .env files (for example: .env* with a negated .env.example rule if needed).'
            exit 1
          fi

      - name: Scan tracked source for obvious literal secrets
        shell: bash
        run: |
          set -euo pipefail
          pattern='(api[_-]?key|access[_-]?token|auth[_-]?token|client[_-]?secret|private[_-]?key|password)[[:space:]]*[:=][[:space:]]*[^$][A-Za-z0-9_./+=:-]{20,}'
          matches="$(git grep -nEI "$pattern" -- ':!*.md' ':!*.lock' ':!package-lock.json' ':!*.example' ':!*.sample' ':!*.template' ':!test/**' ':!tests/**' ':!fixtures/**' || true)"
          if [ -n "$matches" ]; then
            echo 'Potential literal credentials found. Review and move real secrets to managed secrets:'
            printf '%s\n' "$matches"
            exit 1
          fi

      - name: Reject wildcard CORS in application source
        shell: bash
        run: |
          set -euo pipefail
          paths=(-- '*.py' '*.php' '*.js' '*.jsx' '*.ts' '*.tsx' ':!test/**' ':!tests/**' ':!fixtures/**' ':!docs/**')
          header_matches="$(git grep -nEI 'Access-Control-Allow-Origin.*\*' "${paths[@]}" || true)"
          python_matches="$(git grep -nEI "allow_origins[[:space:]]*=[[:space:]]*\\[[[:space:]]*['\\\"]\\*['\\\"]" "${paths[@]}" || true)"
          matches="$(printf '%s\n%s\n' "$header_matches" "$python_matches" | sed '/^$/d')"
          if [ -n "$matches" ]; then
            echo 'Wildcard CORS found in application source. Use an explicit allowlist:'
            printf '%s\n' "$matches"
            exit 1
          fi

      - name: Verify and audit every npm lockfile
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t locks < <(git ls-files | grep -E '(^|/)package-lock\.json$' || true)
          if [ "${#locks[@]}" -eq 0 ]; then
            echo 'No npm lockfiles found.'
            exit 0
          fi
          for lock in "${locks[@]}"; do
            dir="$(dirname "$lock")"
            echo "Auditing npm project in $dir"
            (
              cd "$dir"
              npm ci --ignore-scripts --no-audit --no-fund
              npm audit --omit=dev --audit-level=high
            )
          done

      - name: Flag unsafe browser HTML sinks for review
        shell: bash
        run: |
          set -euo pipefail
          matches="$(git grep -nE '(dangerouslySetInnerHTML|\.innerHTML[[:space:]]*=|insertAdjacentHTML\()' -- '*.js' '*.jsx' '*.ts' '*.tsx' ':!test/**' ':!tests/**' ':!fixtures/**' ':!docs/**' || true)"
          if [ -n "$matches" ]; then
            echo '::warning::Direct HTML rendering sinks found. Confirm every value is trusted or sanitized before rendering.'
            printf '%s\n' "$matches"
          fi

      - name: Security summary
        run: |
          echo 'Security baseline passed.'
          echo 'Repository checks cover current tracked secrets, env hygiene, wildcard CORS, every tracked npm lockfile, high-severity production npm advisories, and unsafe HTML-sink review.'
          echo 'Dashboard/deployment controls such as historical secret scanning, credential rotation, RLS, billing caps, private buckets, HTTPS enforcement, backups and restore tests must be configured at the relevant service.'
